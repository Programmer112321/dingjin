<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>

<script>
(function () {
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var N = 90;
  var maxDist = 130;

  /* ── Detect dark mode ─────────────────────────────────── */
  function isDark() {
    return document.documentElement.getAttribute('data-bs-theme') === 'dark' ||
           document.body.classList.contains('quarto-dark') ||
           window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function dotColor()  { return isDark() ? 'rgba(130,190,255,0.75)' : 'rgba(50,120,200,0.55)'; }
  function lineColor(a){ return isDark() ? 'rgba(130,190,255,'+a+')' : 'rgba(50,120,200,'+a+')'; }

  /* ── Particle constructor ─────────────────────────────── */
  function Particle() {
    this.reset(true);
  }
  Particle.prototype.reset = function (initial) {
    this.x  = Math.random() * canvas.width;
    this.y  = initial ? Math.random() * canvas.height : -5;
    this.vx = (Math.random() - 0.5) * 0.45;
    this.vy = (Math.random() - 0.5) * 0.45;
    this.r  = Math.random() * 1.8 + 0.8;
  };

  /* ── Init / resize ────────────────────────────────────── */
  function init() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    if (particles.length === 0) {
      for (var i = 0; i < N; i++) particles.push(new Particle());
    }
  }

  /* ── Animation loop ───────────────────────────────────── */
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* connections */
    for (var i = 0; i < N; i++) {
      for (var j = i + 1; j < N; j++) {
        var dx   = particles[i].x - particles[j].x;
        var dy   = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDist) {
          var alpha = (1 - dist / maxDist) * 0.28;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = lineColor(alpha);
          ctx.lineWidth   = 0.6;
          ctx.stroke();
        }
      }
    }

    /* dots */
    ctx.fillStyle = dotColor();
    for (var k = 0; k < N; k++) {
      var p = particles[k];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < -10) p.x = canvas.width  + 5;
      if (p.x > canvas.width  + 10) p.x = -5;
      if (p.y < -10) p.y = canvas.height + 5;
      if (p.y > canvas.height + 10) p.y = -5;
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function () {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  init();
  draw();
})();
</script>
